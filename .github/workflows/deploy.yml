name: Deploy Auras effect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          test -s dist/index.html
          test -s dist/background.html
          test -s dist/manifest.json
          test -s dist/icon.svg
          node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8')); if (m.name !== 'Auras effect' || m.version !== '2.5.2' || m.action?.title !== 'Auras effect' || m.action?.popover !== 'https://doctorlowcoding.github.io/Auras-effect/' || m.background_url !== 'https://doctorlowcoding.github.io/Auras-effect/background.html') process.exit(1);"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
